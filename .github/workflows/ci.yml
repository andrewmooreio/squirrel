name: CI

# Branches are tested through their pull request. Pushes to main are tested
# after a merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a run when a newer commit arrives on the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the checks when a change touches only docs. The checks are required,
  # so they must still report: a skipped job counts as passed, but a workflow
  # filtered out with paths-ignore never reports and blocks the merge.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A file counts as code if it matches every rule below.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  check:
    name: Typecheck and lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The typecheck reads the build info that the build step writes.
      - name: Build static assets
        run: npm run build:static
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  # One job for each driver, so a failure names the driver. Both projects run
  # the same test files.
  test:
    name: Test (${{ matrix.project }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [node, workers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The web tests need the build info and the stylesheet hashes.
      - name: Build static assets
        run: npm run build:static
      - name: Test
        run: npx vitest run --project ${{ matrix.project }}
