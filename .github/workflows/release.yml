name: Release

on:
  push:
    branches: [main]

# One run at a time, so two quick merges cannot race on tags or images.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    name: Release PR and tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Move the vX and vX.Y tags to the release commit.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0
      - name: Move major and minor tags
        if: ${{ steps.release.outputs.release_created }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "v${MAJOR}" "v${MAJOR}.${MINOR}"; do
            git tag -f -a "$tag" -m "Release $tag" "$SHA"
            git push --force origin "refs/tags/$tag"
          done

  # The image is built here, not in a separate workflow, because tags made with
  # GITHUB_TOKEN do not trigger other workflows.
  image:
    name: Build and push image
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            # Release: X.Y.Z, X.Y, X and latest.
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.release_created == 'true' }}
            # Push to main without a release: edge and sha-<short> only.
            type=raw,value=edge,enable=${{ needs.release-please.outputs.release_created != 'true' }}
            type=sha,prefix=sha-,format=short,enable=${{ needs.release-please.outputs.release_created != 'true' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
