version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
